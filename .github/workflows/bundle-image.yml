# Builds and pushes the two CLB release-in-a-box images.
#
# Neither carries a release key - that lives in the data artifact - so both are tagged with the
# backend version and published once per backend release, not per COL release:
#
#   clb-bundle          the app: the read API, matching and reconciliation for one release
#   clb-bundle-portal   the mini portal: static pages plus an nginx proxy to the app
#
# Pushes to ghcr.io with the built in GITHUB_TOKEN, so there are no credentials to manage. Both images
# have to be publicly pullable: offline R and OpenRefine users outside GBIF are the whole point.
name: bundle image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, e.g. 1.5.2'
        required: true
      latest:
        description: 'Also move the latest tag'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # Resolved once so the app image and the portal image can never be tagged differently.
  tags:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tags.outputs.version }}
      latest: ${{ steps.tags.outputs.latest }}
    steps:
      - name: Resolve tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            LATEST="${{ inputs.latest }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            LATEST=true
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

  image:
    needs: tags
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/clb-bundle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      # the Dockerfile copies webservice/target/webservice-*.jar, so the shaded jar has to exist
      - name: Build the shaded jar
        run: mvn -B -DskipTests -DskipITs -pl webservice -am install

      - name: Image tags
        id: t
        run: |
          TAGS="$IMAGE:${{ needs.tags.outputs.version }}"
          if [ "${{ needs.tags.outputs.latest }}" = "true" ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bundle/Dockerfile
          push: true
          tags: ${{ steps.t.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.tags.outputs.version }}
            org.opencontainers.image.description=Catalogue of Life release-in-a-box - one COL release, offline

  # Static files only, so no maven and no JDK - it builds in seconds alongside the app image.
  portal:
    needs: tags
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/clb-bundle-portal
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: t
        run: |
          TAGS="$IMAGE:${{ needs.tags.outputs.version }}"
          if [ "${{ needs.tags.outputs.latest }}" = "true" ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bundle/Dockerfile.portal
          push: true
          tags: ${{ steps.t.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.tags.outputs.version }}
            org.opencontainers.image.description=Catalogue of Life release-in-a-box - the mini portal

  summary:
    needs: [tags, image, portal]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          V="${{ needs.tags.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          {
            echo "Pushed \`ghcr.io/$OWNER/clb-bundle:$V\` and \`ghcr.io/$OWNER/clb-bundle-portal:$V\`"
            echo ""
            echo "Build a matching data artifact with:"
            echo '```'
            echo "bundleBuild --key <releaseKey> --dir <out> \\"
            echo "  --image ghcr.io/$OWNER/clb-bundle:$V \\"
            echo "  --portal-image ghcr.io/$OWNER/clb-bundle-portal:$V"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

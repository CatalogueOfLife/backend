# The CLB bundle mini portal: static pages plus a reverse proxy to the bundle API.
#
# Serving the UI from its own container rather than from dropwizard keeps the two
# concerns apart and, more importantly, keeps the page paths free: the app claims
# /taxon, /tree, /dataset, /name and 16 more roots (SingleDatasetRewriteFilter), so
# a page at /taxon/{id} could never share that port. Here only /api/ is proxied, so
# /taxon/{id} is the page and /api/taxon/{id} is the JSON behind it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin for the API, so the page needs no CORS and no absolute host.
    # The trailing slash on proxy_pass strips /api, leaving the keyless paths the
    # bundle already understands: /api/dataset -> /dataset -> /dataset/{releaseKey}.
    #
    # A literal upstream is resolved once at startup, which is why the compose file
    # gates this service on the app being healthy. It also means a recreated app
    # container can leave a stale address behind: restart `web` if the API stops
    # answering after `docker compose up` has replaced `app`.
    #
    # Note that rewriting the prefix costs the percent encoding: nginx normalises the
    # URI here, so an id containing %2F reaches the app as a real slash. The app's own
    # port 8080 is unaffected - it reads the raw path, which is why taxon ids may be
    # URLs there. The mini portal only ever ships with a COL release, whose ids are
    # short opaque strings, so nothing it links to is affected.
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bulk matching streams one long lived response with no output for as long
        # as the file takes, and uploads may be large.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # Detail pages are one file serving every id, so the id falls through to it.
    # Deliberately per section rather than one blanket fallback: a mistyped path
    # should 404 rather than render a taxon page with an error boundary in it.
    location /taxon/ {
        try_files $uri /taxon/index.html;
    }
    location /dataset/ {
        try_files $uri /dataset/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Images are content, and change only when the image does.
    location ~* \.(svg|jpg|jpeg|png|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # The pages, stylesheets and scripts carry no content hash in their names, so a
    # cached copy would survive an upgrade of the portal image and mix old markup
    # with new script. Revalidate them instead - it is one conditional request to a
    # container on the same machine.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

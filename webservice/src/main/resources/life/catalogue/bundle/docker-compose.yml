# CLB release-in-a-box for {{TITLE}} (release {{RELEASE_KEY}}).
# Written by BundleBuildCmd into this artifact - everything it needs is in this directory.
#
#   docker compose up --wait
#
# Three services, all mandatory:
#   postgres  restores the shipped release dump on first boot
#   elastic   always present - the bundle has no pass through search mode
#   app       the read API + name matching + OpenRefine reconciliation for that one release
#
# `--wait` blocks until the app is healthy, which includes the first boot elastic indexing.
# Override the image with CLB_BUNDLE_IMAGE if you build your own.
name: clb-bundle

services:
  postgres:
    image: postgres:17
    shm_size: 1g
    environment:
      POSTGRES_DB: clb
      POSTGRES_USER: col
      POSTGRES_PASSWORD: col
      # C collation, matching how ChecklistBank creates its database
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - .:/bundle:ro
      - ./restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_locks_per_transaction=256
      - -c
      - work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U col -d clb"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30m

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    image: ${CLB_BUNDLE_IMAGE:-{{IMAGE}}}
    depends_on:
      postgres:
        condition: service_healthy
      elastic:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    volumes:
      - ./config.yml:/conf/config.yml:ro
      # read-write: the names index grows as new names are matched and the matcher store keeps its
      # taxonomic group cache in groups.bin
      - .:/data
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      # unhealthy until the first boot elastic indexing has finished
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/healthcheck > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 240
      start_period: 60s

volumes:
  pgdata:
  esdata:
